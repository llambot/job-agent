name: Daily Job Agent

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  run-job-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_TOKEN_B64: ${{ secrets.GMAIL_TOKEN_B64 }}
        run: |
          echo "$GMAIL_TOKEN_B64" | base64 -d > token.pickle
          python main.py --rank-only
      - name: Upload jobs
        uses: actions/upload-artifact@v4
        with:
          name: today-jobs-${{ github.run_id }}
          path: today_jobs.json
          retention-days: 7
          if-no-files-found: warn
      - name: Commit DB
        run: |
          git config user.name "Job Agent Bot"
          git config user.email "laurie@lambot.co"
          git add jobs.db today_jobs.json || true
          git diff --staged --quiet || git commit -m "Daily job update $(date +%Y-%m-%d)"
          git push || true
