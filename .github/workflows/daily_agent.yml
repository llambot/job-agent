name: Daily Job Agent

on:
  schedule:
    # Run every day at 7:00 AM Mountain Time (= 14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  run-job-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install LaTeX (for PDF generation)
        run: sudo apt-get install -y texlive texlive-latex-extra texlive-fonts-recommended

      - name: Run job agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Gmail uses a pre-authorized token stored as a secret
          GMAIL_TOKEN_B64: ${{ secrets.GMAIL_TOKEN_B64 }}
        run: |
          # Restore Gmail token from secret
          echo "$GMAIL_TOKEN_B64" | base64 -d > token.pickle
          python main.py --rank-only

      - name: Upload today's jobs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: today-jobs-${{ env.TODAY }}
          path: today_jobs.json
          retention-days: 7

      - name: Commit updated database
        run: |
          git config user.name "Job Agent Bot"
          git config user.email "laurie@lambot.co"
          git add jobs.db today_jobs.json || true
          git diff --staged --quiet || git commit -m "Daily job update $(date +%Y-%m-%d)"
          git push || true
